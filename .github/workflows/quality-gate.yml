name: Quality Gate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Backend setup
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend typecheck
        working-directory: ./backend
        run: npm run typecheck

      - name: Backend unit tests
        working-directory: ./backend
        run: npm test

      - name: Backend voice harness
        working-directory: ./backend
        run: npm run test:voice

      # Frontend setup
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: ./frontend
        run: npm test

      - name: Frontend E2E tests (Playwright)
        working-directory: ./frontend
        run: npx playwright install && npm run e2e

      - name: Frontend build
        working-directory: ./frontend
        run: npm run build

      # Deploy to Vercel (preview)
      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy Preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prebuilt --token ${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend
        run: npm run build

      # Accessibility audit (axe)
      - name: Install axe-cli
        run: npm i -g axe-cli

      - name: Run axe accessibility audit on built frontend
        working-directory: ./frontend
        run: |
          npx serve -s dist -l 8080 &
          sleep 5
          axe http://localhost:8080 --rules=region,aria-roles,landmark --reporter json > axe-report.json

      - name: Upload axe report
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: ./frontend/axe-report.json

      # Lighthouse (mobile)
      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.14

      - name: Run Lighthouse CI (mobile)
        working-directory: ./frontend
        run: |
          lhci autorun --collect.url=http://localhost:8080 --collect.settings.emulatedFormFactor=mobile

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: ./frontend/.lighthouseci
